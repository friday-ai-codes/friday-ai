[project]
name = "friday-runner"
version = "0.1.0"
description = "Friday AI Runner - independent task executor"
requires-python = ">=3.14"
dependencies = [
 "typer>=0.24.0",
 "httpx>=0.27.0",
 "tomlkit>=0.14.0",
 "cryptography>=42.0",
 "structlog>=25.5.0",
 "tenacity>=8.2.0",
]
[project.scripts]
friday-runner = "friday_runner.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"
[tool.ruff]
line-length = 100
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
