# Alembic 配置文件
# 用于 SQLModel 数据库迁移
[alembic]
# 迁移脚本目录
script_location = src/friday/alembic
# 版本文件命名模板
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s
# 设置为 true 可以在生成迁移时检测到的变更进行 diff
# 默认值 true
prepend_sys_path = .
# 不需要这里配置数据库 URL，从环境变量读取
# sqlalchemy.url 在 env.py 中动态设置
# 日志配置
[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
