[project]
name = "friday"
version = "0.1.0"
description = "AI-powered development automation agent"
requires-python = ">=3.14"
dependencies = [
 # Django core
 "django>=5.1",
 "djangorestframework>=3.15",
 "djangorestframework-simplejwt>=5.3",
 "drf-spectacular>=0.27",
 "django-environ>=0.11",
 # Database drivers (支持多种数据库)
 "psycopg[binary]>=3.3", # PostgreSQL
 "mysqlclient>=2.2", # MySQL / MariaDB
 # Async support
 "uvicorn[standard]>=0.30",
 "httpx>=0.27",
 # Security
 "cryptography>=42.0",
 "passlib[argon2]>=1.7.4",
 # Integrations
 "docker>=7.1.0",
 "gitpython>=3.1.46",
 "lark-oapi>=1.5.2",
 "paramiko>=4.0.0",
 # Utilities
 "structlog>=25.5.0",
 "gunicorn>=23.0.0",
 "channels[daphne]>=4.3.2",
 "daphne>=4.2.1",
 "jsonpath-ng>=1.7.0",
 "qdrant-client>=1.9.0",
 "llama-index>=0.10.0",
 "llama-index-vector-stores-qdrant>=0.2.0",
 "tree-sitter>=0.21.0",
 "tree-sitter-go>=0.21.0",
 "tree-sitter-javascript>=0.21.0",
 "tree-sitter-python>=0.21.0",
 "tree-sitter-css>=0.21.0",
 "tree-sitter-html>=0.21.0",
 "tree-sitter-json>=0.21.0",
 "claude-agent-sdk>=0.1.50",
 # Type checking
 "mypy>=1.14.0",
 "django-stubs>=5.1.0",
 "django-stubs-ext>=5.1.0",
 "djangorestframework-stubs>=3.15.0",
 "jsonschema>=4.23.0",
 # Git platform integrations
 "python-gitlab>=4.0.0",
 "PyGithub>=2.0.0",
 "tenacity>=8.2.0",
 # LLM providers
 "anthropic>=0.40.0",
 "mistune>=3.2.0",
 "django-apscheduler>=0.7.0",
 # System monitoring (Phase)
 "psutil>=5.9.0",
 "python-socks>=2.8.0",
 "openai>=2.16.0",
 "adrf>=0.1.12",
 "google-genai>=1.0.0",
 # RAG Enhancement
 "fastembed>=0.4.0",
 "pywebpush>=2.3.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["friday"]
[dependency-groups]
dev = [
 "debugpy>=1.8.19",
 "hatchling>=1.28.0",
 "pytest>=9.0.2",
 "pytest-asyncio>=1.3.0",
 "pytest-django>=4.8",
 "pytest-cov>=4.1",
 "ruff>=0.14.11",
 "factory-boy>=3.3",
 "types-docker>=7.1.0.20260109",
 "django-stubs-ext>=5.2.8",
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "friday.settings"
pythonpath = ["."]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
[tool.coverage.run]
source = ["friday"]
omit = ["*/migrations/*", "*/tests/*", "*/__pycache__/*"]
[tool.coverage.report]
exclude_lines = [
 "pragma: no cover",
 "def __repr__",
 "raise NotImplementedError",
]
[tool.mypy]
python_version = "3.14"
plugins = [
 "mypy_django_plugin.main",
 "mypy_drf_plugin.main",
]
strict = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
# Django ORM patterns
disallow_untyped_defs = false
check_untyped_defs = false
exclude = [
 "migrations/",
 "__pycache__/",
 ".venv/",
 "workflows/tests/", # 避免与 tests/ 重复
]
# 针对特定模块放宽检查
[[tool.mypy.overrides]]
module = [
 "*.views",
 "*.serializers",
 "*.permissions",
 "*.analytics",
 "*.analytics_serializers",
]
# DRF 视图/序列化器/权限的特殊模式
# type-var: adrf async @action 方法不满足 rest_framework-stubs 的 _View bound
disable_error_code = ["attr-defined", "arg-type", "assignment", "union-attr", "list-item", "return-value", "type-var"]
[[tool.mypy.overrides]]
module = [
 "*.models",
 "*.models.*",
 "workflows.models.*",
]
# Django ORM 动态属性
disable_error_code = ["attr-defined", "assignment"]
[[tool.mypy.overrides]]
module = [
 "*.nodes.*",
 "*.engine.*",
 "*.triggers.*",
]
# 工作流节点的动态类型操作
disable_error_code = ["attr-defined", "arg-type", "assignment", "union-attr", "operator", "call-overload", "return-value"]
[[tool.mypy.overrides]]
module = [
 "services.*",
 "chat.*",
 "projects.*",
]
# 服务层放宽检查
disable_error_code = ["attr-defined", "arg-type", "assignment", "misc", "var-annotated"]
[[tool.mypy.overrides]]
module = [
 "*.urls",
 "*.templates.*",
 "*.approval",
 "feishu.*",
]
# URL 路由和其他模块
disable_error_code = ["attr-defined", "arg-type"]
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["attr-defined", "arg-type", "no-untyped-def"]
[tool.django-stubs]
django_settings_module = "friday.settings"
[tool.ruff]
line-length = 100
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
# uv 通过 [project.scripts] 定义 CLI 入口点
# 常用命令直接使用 uv run：
# uv run mypy . - 类型检查
# uv run ruff check . - 代码检查
# uv run ruff format . - 格式化代码
# uv run pytest - 运行测试
# uv run pytest --cov --cov-report=html - 测试+覆盖率
# uv run python manage.py runserver - 开发服务器
# uv run python manage.py migrate - 数据库迁移
