[project]
name = "friday"
version = "0.1.0"
description = "AI-powered development automation agent"
requires-python = ">=3.11"
dependencies = [
 "aiosqlite>=0.22.1",
 "alembic>=1.14.0",
 "claude-agent-sdk>=0.1.20",
 "cryptography>=46.0.3",
 "docker>=7.1.0",
 "fastapi>=0.128.0",
 "gitpython>=3.1.46",
 "greenlet>=3.3.0",
 "httpx>=0.28.1",
 "lark-oapi>=1.5.2",
 "paramiko>=4.0.0",
 "pydantic-settings>=2.12.0",
 "python-multipart>=0.0.21",
 "sqlmodel>=0.0.31",
 "structlog>=25.5.0",
 "uvicorn[standard]>=0.40.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/friday", "task/src/friday_task"]
[dependency-groups]
dev = [
 "debugpy>=1.8.19",
 "hatchling>=1.28.0",
 "httpx>=0.28.1",
 "pytest>=9.0.2",
 "pytest-asyncio>=1.3.0",
 "ruff>=0.14.11",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
