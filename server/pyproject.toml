[project]
name = "friday"
version = "0.1.0"
description = "AI-powered development automation agent"
requires-python = ">=3.11"
dependencies = [
 # Django core
 "django>=5.1",
 "djangorestframework>=3.15",
 "djangorestframework-simplejwt>=5.3",
 "drf-spectacular>=0.27",
 "django-cors-headers>=4.3",
 "django-environ>=0.11",
 # Async support
 "uvicorn[standard]>=0.30",
 "httpx>=0.27",
 # Security
 "cryptography>=42.0",
 "passlib[argon2]>=1.7.4",
 # Integrations
 "docker>=7.1.0",
 "gitpython>=3.1.46",
 "lark-oapi>=1.5.2",
 "paramiko>=4.0.0",
 # Utilities
 "structlog>=25.5.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["friday", "task/src/friday_task"]
[dependency-groups]
dev = [
 "debugpy>=1.8.19",
 "hatchling>=1.28.0",
 "pytest>=9.0.2",
 "pytest-asyncio>=1.3.0",
 "pytest-django>=4.8",
 "pytest-cov>=4.1",
 "ruff>=0.14.11",
 "factory-boy>=3.3",
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "friday.settings"
pythonpath = ["."]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-v --tb=short"
[tool.coverage.run]
source = ["friday"]
omit = ["*/migrations/*", "*/tests/*", "*/__pycache__/*"]
[tool.coverage.report]
exclude_lines = [
 "pragma: no cover",
 "def __repr__",
 "raise NotImplementedError",
]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
