# Friday AI - 源码构建 Override
# 用法: docker compose -f docker-compose.yaml -f docker-compose.build.yaml up --build
#
# 此文件覆盖 docker-compose.yaml 中的 image 指令，改为从本地源码构建。

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: friday-server:local
    environment:
      - FRIDAY_RUNNER_IMAGE=friday-task:local

  # worker/scheduler 复用 server 构建产物（friday-server:local），无需独立 build context。
  worker:
    image: friday-server:local

  scheduler:
    image: friday-server:local

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: friday-web:local

  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    image: friday-runner:local
    environment:
      - FRIDAY_RUNNER_IMAGE=friday-task:local
    depends_on:
      task-image:
        condition: service_completed_successfully

  # task 镜像没有常驻服务：runner 通过宿主 docker.sock 按需创建任务容器。
  # 这里借一个"构建完即退出"的服务让 compose --build 把镜像构建出来。
  task-image:
    build:
      context: ./task
      dockerfile: Dockerfile
    image: friday-task:local
    entrypoint: ["/bin/true"]
    restart: "no"
