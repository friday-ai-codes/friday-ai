# -- 全局配置
nameOverride: ""
fullnameOverride: ""
# -- 引用已有 Secret（优先于 Chart 创建 Secret）
existingSecret: ""
# -- Server 配置
server:
  replicaCount: 1
  image:
    repository: ghcr.io/friday-ai-codes/friday-ai/server
    # 留空则自动跟随 Chart.appVersion（发布时由 CI 注入），保证镜像与 chart 版本一致
    tag: ""
    pullPolicy: IfNotPresent
  secretKey: "" # Django SECRET_KEY（existingSecret 优先）
  encryptionKey: "" # FRIDAY_ENCRYPTION_KEY
  debug: "false"
  allowedHosts: "*"
  gunicornWorkers: 1
  gunicornTimeout: 300
  adminUsername: "admin"
  adminPassword: ""
  resources: {}
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
# -- Web (nginx) 配置
web:
  replicaCount: 1
  image:
    repository: ghcr.io/friday-ai-codes/friday-ai/web
    # 留空则自动跟随 Chart.appVersion
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
  # -- web PodDisruptionBudget（默认 off）。多副本时启用保驱逐期最小可用。
  # 设 maxUnavailable 优先，否则用 minAvailable。
  pdb:
    enabled: false
    minAvailable: 1
# -- Runner 配置
runner:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/friday-ai-codes/friday-ai/runner
    # 留空则自动跟随 Chart.appVersion
    tag: ""
    pullPolicy: IfNotPresent
  registrationToken: "" # RUNNER_REGISTRATION_TOKEN
  name: "k8s-runner"
  # -- executor 类型：docker（默认）| kubernetes。kubernetes 接受 k8s 别名
  # （与 runner 端 resolveExecutorKind 归一一致；模板对二者等价处理，不会出现
  # k8s 值渲染成 docker 形态却跑 k8s 逻辑的偏差）。
  executor: "docker"
  # docker executor 专用：仅 executor=docker 时挂载 docker.sock 与 supplementalGroups
  dockerSocketPath: /var/run/docker.sock
  dockerGID: 999
  # -- Kubernetes executor 配置（仅 executor=kubernetes/k8s 时生效）
  k8s:
    namespace: "" # 留空走 downward API（Pod 所在 namespace）
    backoffLimit: 0 # Job 重试次数；0=失败留存调试（对齐 docker）
    ttlSecondsAfterFinished: 3600 # 完成 Job 的被动 TTL 清理兜底（秒）
    serviceAccountName: "" # 留空用 <fullname>-runner
    imagePullSecret: "" # 私有 registry 拉取密钥（可选）
    # -- 任务 Job 的 activeDeadlineSeconds 兜底（秒）；>0 时 k8s 主动终止超期 Job，
    # 兜住 runner 永久丢失场景；0=禁用（默认安全，不改变既有行为）。
    activeDeadlineSeconds: 0
    # -- 任务 Pod 的资源 requests/limits（可选，留空=不设置）。便于调度与配额管理。
    taskResources: {}
    # 示例：
    #   requests: { cpu: 250m, memory: 512Mi }
    #   limits:   { cpu: "2",  memory: 4Gi }
  # -- runner RBAC（仅 executor=kubernetes/k8s 时渲染 SA + namespaced Role + RoleBinding）
  rbac:
    create: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
# -- Worker 配置（durable 队列消费进程，同 server 镜像 + run_worker + role=worker）
# 可独立水平伸缩。优雅终止不变式：
#   terminationGracePeriodSeconds(120) > gracefulTimeout(110) > 心跳(10s)/stalled(30s)
# 即 SIGTERM 后 worker 有 gracefulTimeout 秒 drain 在途 job，再留余量供 k8s SIGKILL。
worker:
  enabled: true
  replicaCount: 1
  # 收到 SIGTERM 后等在途 job 完成的最大秒数（透传 run_worker --graceful-timeout）
  gracefulTimeout: 110
  # 必须 > gracefulTimeout，给在途 job drain + k8s 收尾留窗口
  terminationGracePeriodSeconds: 120
  resources: {}
  # -- KEDA 队列深度伸缩（默认 off）。仅在已安装 KEDA operator 的集群启用；
  # 非 KEDA 集群保持 off，否则 apply ScaledObject 会因缺 CRD 整体失败。
  keda:
    enabled: false
    pollingInterval: 30 # 查询队列深度的间隔秒数
    cooldownPeriod: 300 # 缩容前的冷却秒数（防抖）
    minReplicaCount: 1 # 禁 scale-to-zero：保 periodic deferrer 驱动 rescue
    maxReplicaCount: 5
    jobsPerReplica: 10 # 每副本目标消化的 todo job 数（深度/此值 = 目标副本数）
    query: "" # 留空用模板默认 todo 深度查询；按 queue 维度时覆盖（追加 queue_name 过滤）
  # -- worker PodDisruptionBudget（默认 off）。多副本时启用保驱逐期最小可用。
  # 设 minAvailable 优先，否则用 maxUnavailable。
  pdb:
    enabled: false
    maxUnavailable: 1
# -- Scheduler 配置（apscheduler cron 单例 leader，同 server 镜像 + runapscheduler + role=scheduler）
# 强制单实例：replicas 在模板内硬编码为 1 + strategy=Recreate（不暴露 replicaCount），
# 防滚动期双实例重复跑 cron。durable 周期 rescue 不在此（由 worker periodic deferrer 承载）。
scheduler:
  enabled: true
  terminationGracePeriodSeconds: 60
  resources: {}
# -- PostgreSQL 内置部署
postgresql:
  enabled: true
  auth:
    username: friday
    password: friday
    database: friday
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
# -- 外部数据库（postgresql.enabled=false 时使用）
externalDatabase:
  url: "" # postgres://user:${POSTGRES_PASSWORD}@host:5432/dbname
# -- Qdrant 向量数据库
qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: latest
  apiKey: ""
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
# -- 外部 Qdrant（qdrant.enabled=false 时使用）
# 配置后 server 通过 env 直连，前端向导/设置页将锁定 Qdrant 地址（env 优先）。
# 两者都留空（qdrant.enabled=false + url 为空）时，Qdrant 交由首启向导手动配置。
externalQdrant:
  url: "" # http://my-qdrant:6333
  apiKey: ""
# -- Redis（channels channel layer）
# 启用后 server 注入 USE_REDIS_CHANNEL_LAYER=true + REDIS_URL，
# WebSocket 推送可跨 worker / 跨副本工作（gunicornWorkers、replicaCount 才能 >1）。
# redis.enabled=false 且 externalRedis.url 为空时退回内存 channel layer，
# 此时 server 必须保持单 worker 单副本，否则 WS 消息会丢。
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
# -- 外部 Redis（redis.enabled=false 时使用）
externalRedis:
  url: "" # redis://my-redis:6379/0（含密码时形如 redis://:pass@host:6379/0）
# -- Ingress 配置
ingress:
  enabled: false
  className: traefik
  host: friday.local
  annotations: {}
  tls: []
# -- 数据库迁移 Job
migration:
  enabled: true
  activeDeadlineSeconds: 300
