{{- if .Values.runner.enabled }}
{{- $isK8s := eq (include "friday.runner.isK8s" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "friday.fullname" . }}-runner
  labels:
    {{- include "friday.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  replicas: {{ .Values.runner.replicaCount }}
  selector:
    matchLabels:
      {{- include "friday.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        {{- include "friday.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runner
    spec:
      {{- if $isK8s }}
      serviceAccountName: {{ include "friday.runner.serviceAccountName" . }}
      securityContext:
        runAsUser: 65534
      {{- else }}
      securityContext:
        runAsUser: 65534
        supplementalGroups:
          - {{ .Values.runner.dockerGID }}
      {{- end }}
      containers:
        - name: runner
          image: "{{ .Values.runner.image.repository }}:{{ .Values.runner.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.runner.image.pullPolicy }}
          env:
            - name: FRIDAY_RUNNER_URL
              value: "http://{{ include "friday.fullname" . }}-server:8000"
            - name: FRIDAY_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.existingSecret }}{{ .Values.existingSecret }}{{ else }}{{ include "friday.fullname" . }}-secret{{ end }}
                  key: RUNNER_REGISTRATION_TOKEN
            - name: FRIDAY_RUNNER_NAME
              value: {{ .Values.runner.name | quote }}
            - name: FRIDAY_RUNNER_EXECUTOR
              value: {{ .Values.runner.executor | quote }}
            {{- if $isK8s }}
            # task→runner 回调 host：取本 runner Pod IP（downward API），令任务容器经 Pod IP 回调可达。
            - name: FRIDAY_RUNNER_CALLBACK_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FRIDAY_RUNNER_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FRIDAY_RUNNER_K8S_TTL
              value: {{ .Values.runner.k8s.ttlSecondsAfterFinished | quote }}
            - name: FRIDAY_RUNNER_K8S_BACKOFF_LIMIT
              value: {{ .Values.runner.k8s.backoffLimit | quote }}
            {{- if .Values.runner.k8s.imagePullSecret }}
            - name: FRIDAY_RUNNER_K8S_IMAGE_PULL_SECRET
              value: {{ .Values.runner.k8s.imagePullSecret | quote }}
            {{- end }}
            {{- if gt (int .Values.runner.k8s.activeDeadlineSeconds) 0 }}
            # 任务 Job 级超时兜底：runner 永久丢失时由 k8s 主动终止超期 Job。
            - name: FRIDAY_RUNNER_K8S_ACTIVE_DEADLINE
              value: {{ .Values.runner.k8s.activeDeadlineSeconds | quote }}
            {{- end }}
            {{- with .Values.runner.k8s.taskResources }}
            {{- with .requests }}
            {{- if .cpu }}
            - name: FRIDAY_RUNNER_K8S_CPU_REQUEST
              value: {{ .cpu | quote }}
            {{- end }}
            {{- if .memory }}
            - name: FRIDAY_RUNNER_K8S_MEMORY_REQUEST
              value: {{ .memory | quote }}
            {{- end }}
            {{- end }}
            {{- with .limits }}
            {{- if .cpu }}
            - name: FRIDAY_RUNNER_K8S_CPU_LIMIT
              value: {{ .cpu | quote }}
            {{- end }}
            {{- if .memory }}
            - name: FRIDAY_RUNNER_K8S_MEMORY_LIMIT
              value: {{ .memory | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- if not $isK8s }}
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
          {{- end }}
          {{- with .Values.runner.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if not $isK8s }}
      volumes:
        - name: docker-sock
          hostPath:
            path: {{ .Values.runner.dockerSocketPath }}
            type: Socket
      {{- end }}
{{- end }}
