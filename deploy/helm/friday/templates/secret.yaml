{{- if not .Values.existingSecret }}
{{- /*
  密钥解析策略（保证零配置安装即可用，且升级不轮换）：
  1. values 显式提供 → 用它
  2. 否则读取集群中已存在的同名 Secret → 复用旧值（关键：SECRET_KEY / 加密 key
     一旦轮换，历史加密的凭证将无法解密，故升级必须沿用既有值）
  3. 仍为空 → 随机生成（仅首次安装触发）
  QDRANT_API_KEY 默认不生成（保持 Qdrant 默认免鉴权行为，避免与 statefulset 条件不一致）。
  postgres 密码不在此自动生成：它在 PVC 初始化时落盘，自动生成会破坏存量部署。
*/ -}}
{{- $secretName := printf "%s-secret" (include "friday.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- $existingData = $existing.data -}}
{{- end -}}
{{- $secretKey := .Values.server.secretKey | default (get $existingData "SECRET_KEY" | b64dec) | default (randAlphaNum 50) -}}
{{- $encryptionKey := .Values.server.encryptionKey | default (get $existingData "FRIDAY_ENCRYPTION_KEY" | b64dec) | default (randAlphaNum 32 | b64enc) -}}
{{- $runnerToken := .Values.runner.registrationToken | default (get $existingData "RUNNER_REGISTRATION_TOKEN" | b64dec) | default (randAlphaNum 40) -}}
{{- $qdrantApiKey := .Values.qdrant.apiKey | default .Values.externalQdrant.apiKey | default (get $existingData "QDRANT_API_KEY" | b64dec) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "friday.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY: {{ $secretKey | b64enc | quote }}
  FRIDAY_ENCRYPTION_KEY: {{ $encryptionKey | b64enc | quote }}
  DATABASE_URL: {{ if .Values.postgresql.enabled }}{{ printf "postgres://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "friday.fullname" .) .Values.postgresql.auth.database | b64enc | quote }}{{ else }}{{ .Values.externalDatabase.url | b64enc | quote }}{{ end }}
  RUNNER_REGISTRATION_TOKEN: {{ $runnerToken | b64enc | quote }}
  FRIDAY_ADMIN_PASSWORD: {{ .Values.server.adminPassword | b64enc | quote }}
  QDRANT_API_KEY: {{ $qdrantApiKey | b64enc | quote }}
{{- end }}
