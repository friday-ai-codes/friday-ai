{{- /*
  模板期 fail-closed（DEPLOY-03 / T-63-05）：web/server 层真正多进程
  （server.replicaCount>1 或 gunicornWorkers>1）且既无内置 Redis 也无外接 Redis
  时硬失败 —— 多副本/多 worker 误用内存 channel layer 会静默丢 WebSocket 跨副本消息。
  触发条件与下方注入的 FRIDAY_EXPECT_MULTI_REPLICA、settings 运行期校验同源（web 层），
  避免"模板通过、运行期崩"的不对称。注意用 worker.enabled 会误伤"单 server + 关
  Redis + 默认开 worker"部署（configmap 为所有 workload 共享），故只看 web 层。
*/ -}}
{{- if and (or (gt (int .Values.server.replicaCount) 1) (gt (int .Values.server.gunicornWorkers) 1)) (not .Values.redis.enabled) (not .Values.externalRedis.url) }}
{{- fail "server.replicaCount>1 或 server.gunicornWorkers>1 需启用 redis.enabled 或配置 externalRedis.url（多副本/多 worker channel layer 强约束，否则 WS 跨副本丢消息）" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "friday.fullname" . }}-config
  labels:
    {{- include "friday.labels" . | nindent 4 }}
data:
  DEBUG: {{ .Values.server.debug | quote }}
  ALLOWED_HOSTS: {{ .Values.server.allowedHosts | quote }}
  GUNICORN_WORKERS: {{ .Values.server.gunicornWorkers | quote }}
  GUNICORN_TIMEOUT: {{ .Values.server.gunicornTimeout | quote }}
  FRIDAY_ADMIN_USERNAME: {{ .Values.server.adminUsername | quote }}
  FRIDAY_RUNNER_NAME: {{ .Values.runner.name | quote }}
  FRIDAY_RUNNER_EXECUTOR: {{ .Values.runner.executor | quote }}
  # 代码图谱 LSP backend 开关（）：默认禁用 LSP（仅 tree-sitter），
  # 缓解图谱构建慢 / Volar·gopls 冷启动等待。调好后把对应 values 置 true 可逆重开
  # （codegraph.volarBackendEnabled / codegraph.goplsBackendEnabled），无需改镜像。
  VOLAR_BACKEND_ENABLED: {{ .Values.codegraph.volarBackendEnabled | default false | quote }}
  GOPLS_BACKEND_ENABLED: {{ .Values.codegraph.goplsBackendEnabled | default false | quote }}
  # 多副本信号（DEPLOY-03）：web/server 层多进程（replicaCount>1 或 gunicornWorkers>1）
  # 时声明 multi-replica，供 settings 运行期 _require_redis_for_multi_replica 消费。
  # 只看 web 层（不含 worker.enabled）：configmap 由全部 workload 共享，若按 worker.enabled
  # 声明会让"单 server + 关 Redis + 默认开 worker"部署的 web pod 启动即崩。
  FRIDAY_EXPECT_MULTI_REPLICA: {{ if or (gt (int .Values.server.replicaCount) 1) (gt (int .Values.server.gunicornWorkers) 1) }}"true"{{ else }}"false"{{ end }}
  {{- if .Values.qdrant.enabled }}
  # 内置 Qdrant：env 注入内部 Service 地址，server 直连、前端锁定配置（env 优先）
  QDRANT_URL: {{ printf "http://%s-qdrant:6333" (include "friday.fullname" .) | quote }}
  QDRANT_BUNDLED: "true"
  {{- else if .Values.externalQdrant.url }}
  # 外接 Qdrant：env 注入外部地址，server 直连、前端锁定配置
  QDRANT_URL: {{ .Values.externalQdrant.url | quote }}
  QDRANT_BUNDLED: "true"
  {{- end }}
  {{- if .Values.redis.enabled }}
  # 内置 Redis：channel layer 走 Redis，WS 推送可跨 worker / 跨副本
  USE_REDIS_CHANNEL_LAYER: "true"
  REDIS_URL: {{ printf "redis://%s-redis:6379/0" (include "friday.fullname" .) | quote }}
  {{- else if .Values.externalRedis.url }}
  # 外接 Redis
  USE_REDIS_CHANNEL_LAYER: "true"
  REDIS_URL: {{ .Values.externalRedis.url | quote }}
  {{- end }}
