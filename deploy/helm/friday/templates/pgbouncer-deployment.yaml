{{- if .Values.pgbouncer.enabled }}
{{- if not .Values.postgresql.enabled }}
{{- fail "pgbouncer.enabled=true 需要内置 postgresql.enabled=true（外部数据库 + PgBouncer 暂未自动接管：请自行部署 PgBouncer 并把 externalDatabase.url 指向它，同时给 server 设 DB_PGBOUNCER=true、worker/scheduler 直连）。" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "friday.fullname" . }}-pgbouncer
  labels:
    {{- include "friday.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "friday.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pgbouncer
  template:
    metadata:
      labels:
        {{- include "friday.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: "{{ .Values.pgbouncer.image.repository }}:{{ .Values.pgbouncer.image.tag }}"
          imagePullPolicy: {{ .Values.pgbouncer.image.pullPolicy }}
          ports:
            - name: pgbouncer
              containerPort: 6432
              protocol: TCP
          env:
            - name: DB_HOST
              value: {{ printf "%s-postgresql" (include "friday.fullname" .) | quote }}
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: DB_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: DB_NAME
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: LISTEN_PORT
              value: "6432"
            - name: POOL_MODE
              value: {{ .Values.pgbouncer.poolMode | quote }}
            - name: AUTH_TYPE
              value: scram-sha-256
            - name: MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClientConn | quote }}
            - name: DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
            # >0 才能在 transaction 模式下放行 psycopg3 预编译语句
            - name: MAX_PREPARED_STATEMENTS
              value: {{ .Values.pgbouncer.maxPreparedStatements | quote }}
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- with .Values.pgbouncer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
