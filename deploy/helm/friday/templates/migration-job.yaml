{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "friday.fullname" . }}-migrate-{{ now | unixEpoch }}
  labels:
    {{- include "friday.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "friday.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      initContainers:
        {{- if .Values.postgresql.enabled }}
        - name: wait-for-db
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "friday.fullname" . }}-postgresql -p 5432 -U {{ .Values.postgresql.auth.username }}; do
                echo "等待数据库就绪..."
                sleep 2
              done
        {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "执行数据库迁移..."
              python manage.py migrate --noinput
              # 不再自动创建管理员：首次部署的管理员账号改由 Web 首启向导引导用户自行设置。
              # 运维兜底（需手动建/重置管理员时）：
              #   kubectl exec deploy/<server> -- python manage.py init_superuser  # 读取 FRIDAY_ADMIN_USERNAME/PASSWORD（见 server 运行时 env）
              #   kubectl exec deploy/<server> -- python manage.py reset_superuser_password
              echo "迁移完成"
          # 直接使用 env 而非 envFrom，避免 pre-install hook 阶段 ConfigMap/Secret 尚未创建的问题
          # 迁移仅需可启动的非空 SECRET_KEY/加密 key，无需与运行时一致（migrate 不触发加密）
          env:
            # 迁移 Job 显式声明 migrate 角色，抑制 web-only 启动副作用（reconcile/sweep），
            # 与 CI（FRIDAY_PROCESS_ROLE=migrate）及 Phase 60 进程角色门禁契约对齐，避免在迁移
            # 工作负载里误跑 repositories.reset_stuck_indexing 等 web-only reconcile。
            - name: FRIDAY_PROCESS_ROLE
              value: "migrate"
            - name: SECRET_KEY
              value: {{ .Values.server.secretKey | default (randAlphaNum 50) | quote }}
            - name: FRIDAY_ENCRYPTION_KEY
              value: {{ .Values.server.encryptionKey | default (randAlphaNum 32 | b64enc) | quote }}
            - name: DATABASE_URL
              {{- if .Values.postgresql.enabled }}
              value: {{ printf "postgres://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "friday.fullname" .) .Values.postgresql.auth.database | quote }}
              {{- else }}
              value: {{ .Values.externalDatabase.url | quote }}
              {{- end }}
            - name: DEBUG
              value: {{ .Values.server.debug | quote }}
            - name: ALLOWED_HOSTS
              value: {{ .Values.server.allowedHosts | quote }}
{{- end }}
