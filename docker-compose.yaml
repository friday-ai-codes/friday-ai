# Friday AI - Docker Compose 部署配置
# 预构建镜像版本
#
# 初始化配置: scripts/setup.sh
# 启动完整体实例: docker compose up -d
# 源码构建启动: docker compose -f docker-compose.yaml -f docker-compose.build.yaml up --build

services:
  redis:
    image: redis:7-alpine
    container_name: friday-redis
    # 开启 AOF 持久化作为额外保险（Redis 在本项目仅承担 Channel Layer 消息总线
    # 与可选的恢复分布式锁；业务"断点恢复"真相源在 DB/Qdrant/文件系统，不依赖
    # Redis 数据）。AOF 让升级 / 重启后 Redis 自身状态更稳，并不改变恢复语义。
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - "${FRIDAY_DATA_DIR:-~/.friday-ai}/redis:/data"
    networks:
      - friday-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ${FRIDAY_IMAGE_PREFIX:-ghcr.io/friday-ai-codes/friday-ai}/server:${FRIDAY_IMAGE_TAG:-latest}
    container_name: friday-server
    ports:
      - "${FRIDAY_PORT:-10241}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=${DATABASE_URL:-postgres://friday:${POSTGRES_PASSWORD:-friday}@postgres:5432/friday}
      # web 置于 PgBouncer(transaction pooling) 之后时设为 true：Django 关闭服务端游标
      # + 不叠加 psycopg 应用层池（连接复用交给 PgBouncer）。启用 pgbouncer profile 时，
      # 同时把上面的 DATABASE_URL 指向 pgbouncer:6432，并设 DATABASE_URL_DIRECT 让
      # worker/scheduler 仍直连 postgres:5432（Procrastinate LISTEN/NOTIFY 需直连）。
      - DB_PGBOUNCER=${DB_PGBOUNCER:-false}
      - FRIDAY_ENCRYPTION_KEY=${FRIDAY_ENCRYPTION_KEY:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - RUNNER_REGISTRATION_TOKEN=${RUNNER_REGISTRATION_TOKEN:-}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-300}
      - FRIDAY_ADMIN_USERNAME=${FRIDAY_ADMIN_USERNAME:-admin}
      - FRIDAY_ADMIN_PASSWORD=${FRIDAY_ADMIN_PASSWORD:-}
      # Compose 全包部署自带 Redis（见 redis 服务 + depends_on healthy），
      # channel layer 默认直接走 Redis；显式设 false 可退回内存实现（单 worker 才安全）。
      - USE_REDIS_CHANNEL_LAYER=${USE_REDIS_CHANNEL_LAYER:-true}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      # 必须与 qdrant 服务的 QDRANT__SERVICE__API_KEY 用同一默认值。
      # 二者一旦不一致（尤其一边空一边非空），qdrant 健康检查会 401。
      - QDRANT_API_KEY=${QDRANT_API_KEY:-friday-local}
      - QDRANT_BUNDLED=${QDRANT_BUNDLED:-true}
      # 与 runner 服务的 FRIDAY_RUNNER_IMAGE 保持同一默认值（设置页展示用）
      - FRIDAY_RUNNER_IMAGE=${FRIDAY_TASK_IMAGE:-${FRIDAY_IMAGE_PREFIX:-ghcr.io/friday-ai-codes/friday-ai}/task:${FRIDAY_IMAGE_TAG:-latest}}
      # 代码图谱 LSP backend 开关（）：默认禁用 LSP 仅用 tree-sitter
      # （缓解图谱构建慢 / LSP 冷启动）。调好后置 true 可逆重开，无需改代码。
      - VOLAR_BACKEND_ENABLED=${VOLAR_BACKEND_ENABLED:-false}
      - GOPLS_BACKEND_ENABLED=${GOPLS_BACKEND_ENABLED:-false}
    volumes:
      - "${FRIDAY_DATA_DIR:-~/.friday-ai}/server:/app/data"
    # server 需要通过 answer_endpoint（host.docker.internal:<随机端口>）向任务容器
    # 回传交互答案；Linux 上容器内默认无法解析该域名，必须显式映射 host-gateway。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - friday-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # durable 队列消费 worker（同 server 镜像 + run_worker + role=worker，可多副本）。
  # 优雅终止：收到 SIGTERM 后 Procrastinate 内置信号处理停领取并 drain 在途 job，
  # --graceful-timeout 110 控制等待上限；stop_grace_period 120s（> 110）给 compose
  # 收尾余量，对齐 helm terminationGracePeriodSeconds。
  worker:
    image: ${FRIDAY_IMAGE_PREFIX:-ghcr.io/friday-ai-codes/friday-ai}/server:${FRIDAY_IMAGE_TAG:-latest}
    container_name: friday-worker
    command: ["python", "manage.py", "run_worker", "--graceful-timeout", "110"]
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - DEBUG=${DEBUG:-false}
      # worker 必须直连 Postgres：Procrastinate 依赖 LISTEN/NOTIFY，穿不过 PgBouncer
      # transaction pooling。DATABASE_URL_DIRECT 未设时回退到 DATABASE_URL（与今天行为
      # 字节一致）；启用 pgbouncer 时设 DATABASE_URL_DIRECT=postgres://...@postgres:5432。
      - DATABASE_URL=${DATABASE_URL_DIRECT:-${DATABASE_URL:-postgres://friday:${POSTGRES_PASSWORD:-friday}@postgres:5432/friday}}
      - FRIDAY_ENCRYPTION_KEY=${FRIDAY_ENCRYPTION_KEY:-}
      - FRIDAY_PROCESS_ROLE=worker
      - USE_REDIS_CHANNEL_LAYER=${USE_REDIS_CHANNEL_LAYER:-true}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-friday-local}
      - QDRANT_BUNDLED=${QDRANT_BUNDLED:-true}
    networks:
      - friday-network
    # worker 不自 migrate：依赖 server（其 entrypoint 先跑 migrate 再 healthy），
    # 保证首次 up -d 时 procrastinate_jobs 等表已建，避免 worker 起在迁移前崩循环。
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 120s
    # 覆盖镜像内置的 HEALTHCHECK（curl localhost:8000/health 是给 server HTTP 用的）。
    # worker 复用 server 镜像但不监听 8000，沿用会永远 unhealthy（误导且可能触发编排
    # 重启）。worker 健康的根本前提是能连上 Postgres（任务队列在 DB），用镜像必带的
    # psycopg 做轻量连通性检测。
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import os,psycopg; psycopg.connect(os.environ['DATABASE_URL'], connect_timeout=5).close()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # apscheduler cron 单例 scheduler（同 server 镜像 + runapscheduler + role=scheduler）。
  # 首次让 10+1 个 cron 真正运行；单机 compose 默认启用，可用 --scale scheduler=0 关。
  scheduler:
    image: ${FRIDAY_IMAGE_PREFIX:-ghcr.io/friday-ai-codes/friday-ai}/server:${FRIDAY_IMAGE_TAG:-latest}
    container_name: friday-scheduler
    command: ["python", "manage.py", "runapscheduler"]
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - DEBUG=${DEBUG:-false}
      # scheduler 同 worker：直连 Postgres（apscheduler 任务表 + 与 worker 同源约束）。
      - DATABASE_URL=${DATABASE_URL_DIRECT:-${DATABASE_URL:-postgres://friday:${POSTGRES_PASSWORD:-friday}@postgres:5432/friday}}
      - FRIDAY_ENCRYPTION_KEY=${FRIDAY_ENCRYPTION_KEY:-}
      - FRIDAY_PROCESS_ROLE=scheduler
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-friday-local}
      - QDRANT_BUNDLED=${QDRANT_BUNDLED:-true}
    networks:
      - friday-network
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    # 同 worker：覆盖镜像内置的 curl:8000 healthcheck（scheduler 不监听 HTTP），
    # 改为检测 Postgres 连通性（apscheduler 任务表在 DB）。
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import os,psycopg; psycopg.connect(os.environ['DATABASE_URL'], connect_timeout=5).close()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    image: ${FRIDAY_IMAGE_PREFIX:-ghcr.io/friday-ai-codes/friday-ai}/web:${FRIDAY_IMAGE_TAG:-latest}
    container_name: friday-web
    ports:
      - "${FRIDAY_WEB_PORT:-10240}:8080"
    volumes:
      - ./deploy/docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - friday-network
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  runner:
    image: ${FRIDAY_IMAGE_PREFIX:-ghcr.io/friday-ai-codes/friday-ai}/runner:${FRIDAY_IMAGE_TAG:-latest}
    container_name: friday-runner
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    user: "65534:${DOCKER_GID:-999}"
    # CallbackServer 端口必须发布到宿主机：任务容器是宿主 daemon 上的兄弟容器，
    # 通过 host.docker.internal（host-gateway）回调 runner。不发布该端口时，
    # 容器内回调全部 "All connection attempts failed"。
    # 宿主端口必须与容器端口一致（回调 URL 与监听端口同源，见 GetCallbackPort）。
    ports:
      - "${FRIDAY_RUNNER_CALLBACK_PORT:-8976}:${FRIDAY_RUNNER_CALLBACK_PORT:-8976}"
    environment:
      - FRIDAY_RUNNER_URL=http://server:8000
      - FRIDAY_RUNNER_CALLBACK_PORT=${FRIDAY_RUNNER_CALLBACK_PORT:-8976}
      - RUNNER_REGISTRATION_TOKEN=${RUNNER_REGISTRATION_TOKEN:-}
      - FRIDAY_RUNNER_NAME=${FRIDAY_RUNNER_NAME:-compose-runner}
      - FRIDAY_RUNNER_EXECUTOR=docker
      # Task 容器镜像：默认用发版时推送到 ghcr 的预构建镜像；
      # 本地源码调试可改成 friday-task:latest（make build-task 构建）。
      - FRIDAY_RUNNER_IMAGE=${FRIDAY_TASK_IMAGE:-${FRIDAY_IMAGE_PREFIX:-ghcr.io/friday-ai-codes/friday-ai}/task:${FRIDAY_IMAGE_TAG:-latest}}
      # Task 镜像拉取策略：compose 下交给 task-image 占位服务 + `docker compose pull`
      # 统一拉新（见下方 task-image），runner 不再自行联网拉取，避免本机陈旧 latest
      # 永不更新（曾导致发版后 task 镜像停留在旧版）。always/never/missing。
      - FRIDAY_RUNNER_IMAGE_PULL_POLICY=${FRIDAY_RUNNER_IMAGE_PULL_POLICY:-never}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner/entrypoint.sh:/entrypoint.sh:ro
      - "${FRIDAY_DATA_DIR:-~/.friday-ai}/runner:/data"
    networks:
      - friday-network
    depends_on:
      server:
        condition: service_healthy
      # 确保 task 镜像在 runner 起来前已被拉到本机（见 task-image 占位服务）。
      task-image:
        condition: service_completed_successfully
    restart: unless-stopped

  # task 镜像无常驻服务：runner 通过宿主 docker.sock 按需创建任务容器。
  # 这里用一个"启动即退出(exit 0)"的占位服务，让 `docker compose pull` 把 task 镜像
  # 拉到本机缓存（task 不在 compose services 内时 compose pull 不会碰它，正是发版后
  # task 镜像不更新的根因）。runner depends_on 本服务完成后再启动，全程不自行拉取。
  task-image:
    image: ${FRIDAY_TASK_IMAGE:-${FRIDAY_IMAGE_PREFIX:-ghcr.io/friday-ai-codes/friday-ai}/task:${FRIDAY_IMAGE_TAG:-latest}}
    container_name: friday-task-image
    entrypoint: ["/bin/true"]
    restart: "no"

  postgres:
    image: postgres:17-alpine
    container_name: friday-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-friday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-friday}
      POSTGRES_DB: ${POSTGRES_DB:-friday}
    volumes:
      - "${FRIDAY_DATA_DIR:-~/.friday-ai}/postgres:/var/lib/postgresql/data"
    networks:
      - friday-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-friday}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PgBouncer 连接池（opt-in）：默认 `docker compose up` 不启动；需要时用
  #   docker compose --profile pgbouncer up -d
  # 并按 .env.example「PgBouncer」一节设置：
  #   DATABASE_URL=postgres://friday:${POSTGRES_PASSWORD}@pgbouncer:6432/friday  # web 走池
  #   DATABASE_URL_DIRECT=postgres://friday:${POSTGRES_PASSWORD}@postgres:5432/friday  # worker/scheduler 直连
  #   DB_PGBOUNCER=true
  # transaction 模式 + max_prepared_statements>0 兼容 psycopg3 预编译语句（pgbouncer≥1.21）。
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: friday-pgbouncer
    profiles: ["pgbouncer"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-friday}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-friday}
      - DB_NAME=${POSTGRES_DB:-friday}
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - AUTH_TYPE=scram-sha-256
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      - DEFAULT_POOL_SIZE=${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      # >0 才能在 transaction 模式下放行 psycopg3 的预编译语句，否则会
      # "prepared statement already exists"。
      - MAX_PREPARED_STATEMENTS=${PGBOUNCER_MAX_PREPARED_STATEMENTS:-200}
    networks:
      - friday-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-friday}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: friday-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      # 默认值必须与 server 的 QDRANT_API_KEY 保持一致（见上）。
      # 注意：qdrant 只要该变量"存在且为空字符串"就会开启鉴权但 key 为空，
      # 而客户端不会发送空 key，因此这里绝不能留空，必须有非空默认值。
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-friday-local}
    volumes:
      - "${FRIDAY_DATA_DIR:-~/.friday-ai}/qdrant:/qdrant/storage"
    networks:
      - friday-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf "GET /readyz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "all shards are ready" <&3'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  friday-network:
    driver: bridge
