[project]
name = "friday-task"
version = "0.1.0"
description = "AI-powered task executor for Friday development automation"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "gitpython>=3.1.42",
    "structlog>=24.1.0",
    "claude-agent-sdk==0.1.58",
    # claude-agent-sdk 0.1.58 只声明 mcp>=0.1.0，但它的 create_sdk_mcp_server 依赖
    # mcp 1.x lowlevel Server 的 @server.list_tools() 装饰器——mcp 2.0 已移除该 API。
    # 上界必须显式钉死，否则容器构建会解析到 2.x 并在建 MCP server 时直接 AttributeError。
    "mcp>=1.25.0,<2",
    "jinja2>=3.1.6,<4.0",
    "click>=8.0.0",
    "tenacity>=8.2.0",
]

[project.scripts]
friday-task = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "core", "git_ops", "integrations"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
