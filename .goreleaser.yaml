version: 2
builds:
 - id: friday-runner
 main: ./cmd/friday-runner
 dir: runner
 binary: friday-runner
 env:
 - CGO_ENABLED=0
 goos:
 - linux
 - darwin
 goarch:
 - amd64
 - arm64
 ldflags:
 - -s -w -X github.com/friday-ai-codes/friday-ai/runner/internal/cmd.Version={{.Version}}
 mod_timestamp: "{{.CommitTimestamp}}"
archives:
 - format: tar.gz
 name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
 name_template: checksums.txt
changelog:
 sort: asc
 filters:
 exclude:
 - "^docs:"
 - "^test:"
