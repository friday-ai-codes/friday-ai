services:
 server:
 build:
 context: ./server
 dockerfile: Dockerfile
 container_name: friday-server
 ports:
 - "${FRIDAY_PORT:-10241}:8000"
 environment:
 - SECRET_KEY=${SECRET_KEY}
 - DEBUG=${DEBUG:-false}
 - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/friday.db}
 - FRIDAY_ENCRYPTION_KEY=${FRIDAY_ENCRYPTION_KEY}
 volumes:
 - ~/.friday-data:/app/data
 - /var/run/docker.sock:/var/run/docker.sock
 networks:
 - friday-network
 restart: unless-stopped
 healthcheck:
 test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
 interval: 30s
 timeout: 10s
 retries: 3
 start_period: 10s
 web:
 build:
 context: ./web
 dockerfile: Dockerfile
 container_name: friday-web
 ports:
 - "${FRIDAY_WEB_PORT:-10240}:80"
 networks:
 - friday-network
 depends_on:
 server:
 condition: service_healthy
 restart: unless-stopped
 healthcheck:
 test:
 [
 "CMD",
 "wget",
 "--no-verbose",
 "--tries=1",
 "--spider",
 "http://localhost:80/",
 ]
 interval: 30s
 timeout: 10s
 retries: 3
 start_period: 5s
 task-builder:
 build:
 context: ./task
 dockerfile: Dockerfile
 image: friday-task:latest
 container_name: friday-task-builder
 command: ["--help"]
 networks:
 - friday-network
 qdrant:
 image: qdrant/qdrant:latest
 container_name: friday-qdrant
 ports:
 - "${QDRANT_HTTP_PORT:-6333}:6333"
 - "${QDRANT_GRPC_PORT:-6334}:6334"
 environment:
 - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
 volumes:
 - ~/.friday-data/qdrant:/qdrant/storage
 networks:
 - friday-network
 restart: unless-stopped
 healthcheck:
 test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/readyz"]
 interval: 30s
 timeout: 10s
 retries: 3
 start_period: 10s
volumes:
 friday-data:
 driver: local
networks:
 friday-network:
 driver: bridge
