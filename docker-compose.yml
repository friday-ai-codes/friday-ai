services:
 # Backend API
 server:
 build:
 context: ./server
 dockerfile: Dockerfile
 container_name: friday-server
 ports:
 - "${FRIDAY_PORT:-10241}:8000"
 environment:
 - FRIDAY_DEBUG=${FRIDAY_DEBUG:-false}
 - FRIDAY_DATABASE_URL=sqlite+aiosqlite:///./data/friday.db
 - FRIDAY_PORT=8000
 - FRIDAY_HOST=0.0.0.0
 - FRIDAY_ENCRYPTION_KEY=${FRIDAY_ENCRYPTION_KEY}
 - FRIDAY_FEISHU_APP_ID=${FRIDAY_FEISHU_APP_ID}
 - FRIDAY_FEISHU_APP_SECRET=${FRIDAY_FEISHU_APP_SECRET}
 - FRIDAY_FEISHU_VERIFICATION_TOKEN=${FRIDAY_FEISHU_VERIFICATION_TOKEN}
 - FRIDAY_GITHUB_WEBHOOK_SECRET=${FRIDAY_GITHUB_WEBHOOK_SECRET}
 - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
 volumes:
 - friday-data:/app/data
 - /var/run/docker.sock:/var/run/docker.sock
 networks:
 - friday-network
 restart: unless-stopped
 healthcheck:
 test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
 interval: 30s
 timeout: 10s
 retries: 3
 start_period: 10s
 # Frontend - Nginx 提供静态文件服务和 API 反向代理
 web:
 build:
 context: ./web
 dockerfile: Dockerfile
 container_name: friday-web
 ports:
 - "${FRIDAY_WEB_PORT:-10240}:80"
 networks:
 - friday-network
 depends_on:
 server:
 condition: service_healthy
 restart: unless-stopped
 healthcheck:
 test:
 [
 "CMD",
 "wget",
 "--no-verbose",
 "--tries=1",
 "--spider",
 "http://localhost:80/",
 ]
 interval: 30s
 timeout: 10s
 retries: 3
 start_period: 5s
 # Task container builder (helper service)
 task-builder:
 build:
 context: ./server/task
 dockerfile: Dockerfile
 image: friday-task:latest
 container_name: friday-task-builder
 command: ["echo", "Task image built successfully"]
 networks:
 - friday-network
volumes:
 friday-data:
 driver: local
networks:
 friday-network:
 driver: bridge
