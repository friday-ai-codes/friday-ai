services:
 # Backend API
 server:
 build:
 context: ./server
 dockerfile: Dockerfile
 container_name: friday-server
 ports:
 - "${FRIDAY_PORT:-10241}:8000"
 environment:
 - SECRET_KEY=${SECRET_KEY}
 - DEBUG=${DEBUG:-false}
 - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
 - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/friday.db}
 - FRIDAY_ENCRYPTION_KEY=${FRIDAY_ENCRYPTION_KEY}
 - FRIDAY_GITHUB_WEBHOOK_SECRET=${FRIDAY_GITHUB_WEBHOOK_SECRET}
 - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
 - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
 - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
 volumes:
 - ~/.friday-data:/app/data
 - /var/run/docker.sock:/var/run/docker.sock
 networks:
 - friday-network
 restart: unless-stopped
 healthcheck:
 test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
 interval: 30s
 timeout: 10s
 retries: 3
 start_period: 10s
 # Frontend - Nginx 提供静态文件服务和 API 反向代理
 web:
 build:
 context: ./web
 dockerfile: Dockerfile
 container_name: friday-web
 ports:
 - "${FRIDAY_WEB_PORT:-10240}:80"
 networks:
 - friday-network
 depends_on:
 server:
 condition: service_healthy
 restart: unless-stopped
 healthcheck:
 test:
 [
 "CMD",
 "wget",
 "--no-verbose",
 "--tries=1",
 "--spider",
 "http://localhost:80/",
 ]
 interval: 30s
 timeout: 10s
 retries: 3
 start_period: 5s
 # Task container builder (helper service)
 # 任务执行容器，独立项目，支持 CLI 和容器模式
 task-builder:
 build:
 context: ./task
 dockerfile: Dockerfile
 image: friday-task:latest
 container_name: friday-task-builder
 command: ["--help"]
 networks:
 - friday-network
volumes:
 friday-data:
 driver: local
networks:
 friday-network:
 driver: bridge
