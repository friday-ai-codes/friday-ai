name: Deploy Docs

"on":
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yaml'
  # 允许手动触发（首次开通 Pages 或紧急重发）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 部署不允许并行；新 push 等待而不是取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build docs
        # 项目站点部署在 https://friday-ai-codes.github.io/friday-ai/，需要 base 前缀
        run: pnpm docs:build
        env:
          DOCS_BASE: /friday-ai/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
