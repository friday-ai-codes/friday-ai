name: CI

# 四个组件的门禁：
#   - server-ci       默认 SQLite 路径（零回归基线，addopts 默认排除 postgres_queue）
#   - postgres-queue  postgres:17-alpine service container 跑 -m postgres_queue
#   - web-ci          vue-tsc 类型检查 + vitest
#   - runner-ci       go build / vet / test -race
#   - task-ci         容器任务执行器 pytest
#
# 后三个 job 是补齐的：此前 CI 只有 server 两个 job，web / runner / task 长期无门禁，
# 直接后果是前端积累了 6 个与实现漂移的失败测试（文案改了断言没改、表单插入字段把
# 位置下标顶偏）而无人发现，runner 的 task.cancel 整条链路断裂也没被拦住。
#
# 未做 per-job 路径过滤（需引第三方 paths-filter action）：宁可多跑几分钟，也不冒
# 「该跑的检查被静默跳过」的风险——上面那批漂移正是没人跑出来的。concurrency 会
# 取消被取代的旧 run，实际浪费有限。
"on":
  # 手动触发：paths 过滤会让「只改仓库根配置（如 .gitignore）却影响 CI」的提交不触发
  # 本工作流，需要一个不依赖改动路径的入口来验证门禁本身。
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "runner/**"
      - "task/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "runner/**"
      - "task/**"
      - ".github/workflows/ci.yaml"

permissions:
  contents: read

# 同一分支/PR 的新 push 自动取消仍在进行的旧 run，避免重复占用与长时间空转
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-ci:
    name: server-ci (SQLite 默认)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      # submodules 必须拉取：skills 快照守卫（test_skills_snapshot_guard）扫
      # `skills/skills/*/SKILL.md`，skills 是 submodule；不拉会扫到 0 个文件，
      # 守卫按设计直接失败（防路径漂移导致主守卫静默空跑假绿）。
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # 架构守卫测试（如 test_no_loop_set_payload / test_no_retrieve_with_vectors /
      # test_no_layered_search_direct_import_in_callsites）经 subprocess 调 `rg`
      # 扫码库找反模式；ubuntu runner 默认未装 ripgrep，缺失会 FileNotFoundError。
      - name: Install ripgrep (架构守卫测试依赖 rg)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: server/.python-version
          allow-prereleases: true
      - name: Install dependencies (含 dev 组)
        run: uv sync --locked --dev
      - name: Django system check
        run: uv run python manage.py check
      # 全量 ruff 仍有大量历史遗留告警；作为 advisory baseline 不阻塞门禁，
      # 与历史 ci.yaml 既有约定一致（聚焦阶段不顺带清理 legacy lint）。
      - name: Ruff lint (advisory legacy baseline)
        continue-on-error: true
        run: uv run ruff check .
      # 默认 addopts 即 SQLite 且 `-m 'not ... and not postgres_queue'`，
      # 无需显式 -m；该步骤即"SQLite 默认路径不受影响"的零回归门禁。
      #
      # 失败时把 short summary 的 FAILED/ERROR 行转为 ::error:: 注解：注解经
      # check-runs 公开 API 可读，无需仓库登录即可定位失败用例（完整日志需要
      # actions:read 权限，排查 CI-only flaky 时反而不如注解可达）。
      - name: Pytest (SQLite 默认路径)
        run: |
          set -o pipefail
          uv run pytest 2>&1 | tee pytest-output.log || {
            grep -E '^(FAILED|ERROR) ' pytest-output.log | head -50 | sed 's/^/::error::/'
            exit 1
          }

  postgres-queue:
    name: postgres-queue (durable Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # 后端经唯一权威判定 _use_procrastinate：Postgres + DURABLE_TASK_BACKEND∈{auto,procrastinate}
    # → 启用 Procrastinate 并注册 procrastinate.contrib.django（migrate 据此建 procrastinate 表）。
    env:
      DATABASE_URL: postgres://friday:friday@127.0.0.1:5432/friday_test
      DURABLE_TASK_BACKEND: procrastinate
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: friday
          POSTGRES_PASSWORD: friday
          POSTGRES_DB: friday_test
        ports:
          - 5432:5432
        # pg_isready health check：service 就绪前 job 步骤不会启动，避免连接竞态
        options: >-
          --health-cmd "pg_isready -U friday -d friday_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: server/.python-version
          allow-prereleases: true
      - name: Install dependencies (含 dev 组)
        run: uv sync --locked --dev
      # 迁移角色短路 web-only 启动副作用（DURABLE-02）；对真实 Postgres 建含
      # procrastinate 的全部表，避免测试期 `relation "procrastinate_jobs" does not exist`（Pitfall 3）。
      - name: Migrate (建 procrastinate 表)
        env:
          FRIDAY_PROCESS_ROLE: migrate
        run: uv run python manage.py migrate --noinput
      # --allow-hosts 放行 pytest-socket（默认 --disable-socket）对 127.0.0.1:5432 的 TCP 连接（Pitfall 2）。
      # 覆盖 defer/priority/retry-backoff/stalled rescue(forged-heartbeat)/并发 worker 竞争/SQLite fallback 退化。
      # 注：真实 kill-worker E2E 为 human_needed（见 60-VALIDATION.md），CI 以 forged-heartbeat 自动逼近 rescue。
      - name: Pytest -m postgres_queue (durable Postgres 行为)
        run: uv run pytest -m postgres_queue --allow-hosts=127.0.0.1,localhost

  web-ci:
    name: web-ci (类型检查 + 单测)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      # pnpm 版本以 web/package.json 的 packageManager 字段为准（corepack 语义），
      # 不在此处写死，避免与仓库声明漂移。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 类型检查是硬门禁：它是这套自动导入 + 泛型偏重的前端里最便宜的整体性检查。
      - name: Type check (vue-tsc)
        run: pnpm exec vue-tsc --noEmit
      - name: Vitest
        run: pnpm exec vitest run
      # ESLint 目前有约 100 处历史遗留问题（多为 jsdoc/格式类），与 server 侧 ruff
      # 同样按 advisory 处理，不阻塞门禁；待单独一次全量整改后再翻成硬门禁。
      - name: ESLint (advisory legacy baseline)
        continue-on-error: true
        run: pnpm exec eslint src

  runner-ci:
    name: runner-ci (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # -race：调度器有 sync.Map + Cond + semaphore 的并发面（task.cancel 要在
      # 队列态与运行态之间取舍），竞态回归靠普通 go test 抓不到。
      - name: Test (race)
        run: go test ./... -race -count=1

  task-ci:
    name: task-ci (容器任务执行器)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task
    steps:
      - uses: actions/checkout@v6
        # skills 同源一致性测试（test_skills_injection.py 的 hash 断言）要比对
        # task/assets/skills 与 skills submodule，不拉 submodule 会失败。
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install dependencies (含 dev 组)
        run: uv sync --locked --dev
      - name: Pytest
        run: uv run pytest
