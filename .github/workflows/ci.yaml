name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      runner: ${{ steps.filter.outputs.runner }}
      task: ${{ steps.filter.outputs.task }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'conftest.py'
              - '.github/workflows/ci.yaml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yaml'
            runner:
              - 'runner/**'
              - '.github/workflows/ci.yaml'
            task:
              - 'task/**'
              - '.github/workflows/ci.yaml'

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.29.1
      - name: Scan Git history for secrets
        run: $(go env GOPATH)/bin/gitleaks detect --source . --redact --verbose

  open-source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate setup script syntax
        run: bash -n scripts/setup.sh
      - name: Generate example environment
        run: scripts/setup.sh --non-interactive --force --data-dir "$RUNNER_TEMP/friday-data"
      - name: Validate Docker Compose config
        run: docker compose config

  commit-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: scripts/check_commit_messages.sh --all

  server-ci:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Ruff lint (advisory legacy baseline)
        continue-on-error: true
        run: uv run ruff check . --exclude '**/migrations/*.py' --exclude '**/tests/**' --exclude 'tests/**' --exclude 'test_claude_agent_sdk.py'
      - name: Mypy type check (advisory legacy baseline)
        continue-on-error: true
        run: >
          uv run mypy
          access_tokens accounts agents chat code_relations codegraph common compat core
          feishu friday identity interactions mcp_tools orchestration permissions projects
          prompts repositories runners services subagent system tasks tools utils workflows
          manage.py
      - name: Check prompt hardcoding
        run: bash ../scripts/check_prompt_hardcoding.sh
      - name: Pytest smoke with coverage
        run: >
          uv run pytest
          tests/test_credential_leak_protection.py
          tests/test_interactions_ledger.py
          tests/mcp_tools/test_feishu_work_item_context.py
          tests/test_httpx_removal_guard.py
          tests/test_conversation_facade_waiting_clarification.py
          tests/test_intent_router.py
          tests/test_langchain_runner_core.py
          tests/test_langchain_runner_no_stategraph.py
          tests/test_coding_progress.py
          --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage.xml
          if-no-files-found: ignore

  web-ci:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: Unit tests with coverage
        run: pnpm test:unit:coverage
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright e2e smoke
        run: pnpm test:e2e:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage-and-playwright
          path: |
            web/coverage/
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

  runner-ci:
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test ./...
      - name: Go build
        run: go build ./...

  task-ci:
    needs: changes
    if: needs.changes.outputs.task == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pytest with coverage
        run: uv run pytest --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-coverage
          path: task/coverage.xml
          if-no-files-found: ignore

  task-image-ci:
    needs: changes
    if: needs.changes.outputs.task == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build task image
        run: docker build -t friday-task:test task/
      - name: Check image size
        run: |
          size=$(docker image inspect friday-task:test --format '{{.Size}}')
          max_size=$((750 * 1024 * 1024))
          size_mb=$(( size / 1024 / 1024 ))
          echo "Image size: ${size_mb} MB"
          if [ "$size" -gt "$max_size" ]; then
            echo "::error::Image size ${size_mb} MB exceeds 750 MB"
            exit 1
          fi
      - name: Trivy CVE scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: friday-task:test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Smoke test - coding import
        run: docker run --rm friday-task:test python -c "from core.runner import TaskRunner; print('coding import ok')"
      - name: Smoke test - repo_summary config
        run: docker run --rm -e TASK_MODE=repo_summary friday-task:test python -c "from core.config import TaskConfig; print('repo_summary config ok')"

  ci-gate:
    needs:
      - security-scan
      - open-source-smoke
      - commit-message
      - server-ci
      - web-ci
      - runner-ci
      - task-ci
      - task-image-ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          echo "security-scan: ${{ needs.security-scan.result }}"
          echo "open-source-smoke: ${{ needs.open-source-smoke.result }}"
          echo "commit-message: ${{ needs.commit-message.result }}"
          echo "server-ci: ${{ needs.server-ci.result }}"
          echo "web-ci: ${{ needs.web-ci.result }}"
          echo "runner-ci: ${{ needs.runner-ci.result }}"
          echo "task-ci: ${{ needs.task-ci.result }}"
          echo "task-image-ci: ${{ needs.task-image-ci.result }}"
          for result in \
            "${{ needs.security-scan.result }}" \
            "${{ needs.open-source-smoke.result }}" \
            "${{ needs.commit-message.result }}" \
            "${{ needs.server-ci.result }}" \
            "${{ needs.web-ci.result }}" \
            "${{ needs.runner-ci.result }}" \
            "${{ needs.task-ci.result }}" \
            "${{ needs.task-image-ci.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "CI failed: found '$result'"
              exit 1
            fi
          done
          echo "CI passed: all checks succeeded or were skipped"
