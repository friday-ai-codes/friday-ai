name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# 同一分支/PR 的新 push 自动取消仍在进行的旧 run，避免重复占用与长时间空转
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 强制所有 JavaScript action 跑在 Node.js 24 上（GitHub 2026-06-16 起默认）。
# 一次性消除 paths-filter / setup-python / setup-go / setup-uv / upload-artifact 等
# 仍声明 Node 20 的 action 的弃用警告，无需逐个等待各 action 发布 node24 大版本。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      runner: ${{ steps.filter.outputs.runner }}
      task: ${{ steps.filter.outputs.task }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'conftest.py'
              - '.github/workflows/ci.yaml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yaml'
            runner:
              - 'runner/**'
              - '.github/workflows/ci.yaml'
            task:
              - 'task/**'
              - '.github/workflows/ci.yaml'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'CONTRIBUTING.md'
              - 'SECURITY.md'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yaml'

  security-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.29.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks (prebuilt binary)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan Git history for secrets
        run: gitleaks detect --source . --redact --verbose

  open-source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate setup script syntax
        run: bash -n scripts/setup.sh
      - name: Generate example environment
        run: scripts/setup.sh --non-interactive --force --data-dir "$RUNNER_TEMP/friday-data"
      - name: Validate Docker Compose config
        run: docker compose config

  commit-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: scripts/check_commit_messages.sh --all

  server-ci:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true
      # 缓存整个虚拟环境（按 uv.lock 哈希）：命中后 uv sync 仅做一致性校验，
      # 跳过重型依赖（mysqlclient/tree-sitter 等需编译）的重复安装。
      - uses: actions/cache@v4
        with:
          path: server/.venv
          key: venv-server-${{ runner.os }}-py3.14-${{ hashFiles('server/uv.lock') }}
      - name: Install dependencies
        run: uv sync --locked --dev
      # mypy 增量缓存：跨 run 复用 .mypy_cache，缩短类型检查耗时
      - uses: actions/cache@v4
        with:
          path: server/.mypy_cache
          key: mypy-server-${{ runner.os }}-${{ hashFiles('server/uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-server-${{ runner.os }}-${{ hashFiles('server/uv.lock') }}-
            mypy-server-${{ runner.os }}-
      - name: Ruff lint (advisory legacy baseline)
        continue-on-error: true
        run: uv run ruff check . --exclude '**/migrations/*.py' --exclude '**/tests/**' --exclude 'tests/**' --exclude 'test_claude_agent_sdk.py'
      - name: Mypy type check (advisory legacy baseline)
        continue-on-error: true
        run: >
          uv run mypy
          access_tokens accounts agents chat code_relations codegraph common compat core
          feishu friday identity interactions mcp_tools orchestration permissions projects
          prompts repositories runners services subagent system tasks tools utils workflows
          manage.py
      - name: Check prompt hardcoding
        run: bash ../scripts/check_prompt_hardcoding.sh
      - name: Pytest smoke with coverage
        run: >
          uv run pytest
          tests/test_credential_leak_protection.py
          tests/test_interactions_ledger.py
          tests/mcp_tools/test_feishu_work_item_context.py
          tests/test_httpx_removal_guard.py
          tests/test_conversation_facade_waiting_clarification.py
          tests/test_intent_router.py
          tests/test_langchain_runner_core.py
          tests/test_langchain_runner_no_stategraph.py
          tests/test_coding_progress.py
          tests/test_access_tokens.py
          tests/test_no_plaintext_token_in_db.py
          tests/test_pat_identity.py
          tests/test_conversation_isolation.py
          tests/test_admin_conversations.py
          tests/test_tool_bindings.py
          tests/test_remote_tool_execute.py
          --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage.xml
          if-no-files-found: ignore

  web-ci:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Type check
        run: pnpm type-check
      - name: Unit tests with coverage
        run: pnpm test:unit:coverage
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: web/coverage/
          if-no-files-found: ignore

  # e2e 拆出独立 job，跑在官方 Playwright 镜像里（浏览器 + 系统依赖已预装），
  # 省去 `playwright install --with-deps`，并与 web-ci 的 lint/type/unit/build 并行。
  # 镜像 tag 必须与 web/pnpm-lock.yaml 中解析到的 @playwright/test 版本一致（当前 1.57.0）。
  web-e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Playwright e2e smoke
        run: pnpm test:e2e:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

  docs-ci:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build docs
        run: pnpm docs:build

  runner-ci:
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test ./...
      - name: Go build
        run: go build ./...

  task-ci:
    needs: changes
    if: needs.changes.outputs.task == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true
      - uses: actions/cache@v4
        with:
          path: task/.venv
          key: venv-task-${{ runner.os }}-py3.14-${{ hashFiles('task/uv.lock') }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pytest with coverage
        run: uv run pytest --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-coverage
          path: task/coverage.xml
          if-no-files-found: ignore

  task-image-ci:
    needs: changes
    if: needs.changes.outputs.task == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build task image
        uses: docker/build-push-action@v6
        with:
          context: task
          load: true
          tags: friday-task:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image size
        run: |
          size=$(docker image inspect friday-task:test --format '{{.Size}}')
          max_size=$((750 * 1024 * 1024))
          size_mb=$(( size / 1024 / 1024 ))
          echo "Image size: ${size_mb} MB"
          if [ "$size" -gt "$max_size" ]; then
            echo "::error::Image size ${size_mb} MB exceeds 750 MB"
            exit 1
          fi
      - name: Trivy CVE scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: friday-task:test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Smoke test - coding import
        run: docker run --rm --entrypoint python friday-task:test -c "from core.runner import TaskRunner; print('coding import ok')"
      - name: Smoke test - repo_summary config
        run: docker run --rm -e TASK_MODE=repo_summary --entrypoint python friday-task:test -c "from core.config import TaskConfig; print('repo_summary config ok')"

  ci-gate:
    needs:
      - security-scan
      - open-source-smoke
      - commit-message
      - server-ci
      - web-ci
      - web-e2e
      - docs-ci
      - runner-ci
      - task-ci
      - task-image-ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          echo "security-scan: ${{ needs.security-scan.result }}"
          echo "open-source-smoke: ${{ needs.open-source-smoke.result }}"
          echo "commit-message: ${{ needs.commit-message.result }}"
          echo "server-ci: ${{ needs.server-ci.result }}"
          echo "web-ci: ${{ needs.web-ci.result }}"
          echo "web-e2e: ${{ needs.web-e2e.result }}"
          echo "docs-ci: ${{ needs.docs-ci.result }}"
          echo "runner-ci: ${{ needs.runner-ci.result }}"
          echo "task-ci: ${{ needs.task-ci.result }}"
          echo "task-image-ci: ${{ needs.task-image-ci.result }}"
          for result in \
            "${{ needs.security-scan.result }}" \
            "${{ needs.open-source-smoke.result }}" \
            "${{ needs.commit-message.result }}" \
            "${{ needs.server-ci.result }}" \
            "${{ needs.web-ci.result }}" \
            "${{ needs.web-e2e.result }}" \
            "${{ needs.docs-ci.result }}" \
            "${{ needs.runner-ci.result }}" \
            "${{ needs.task-ci.result }}" \
            "${{ needs.task-image-ci.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "CI failed: found '$result'"
              exit 1
            fi
          done
          echo "CI passed: all checks succeeded or were skipped"
