name: Build & Release
on:
 push:
 tags:
 - "v*" # v1.0.0, v16.0.0-rc.1 等
 - "server-v*" # server-v1.0.0（仅后端）
 - "web-v*" # web-v1.0.0（仅前端）
 - "runner-v*" # runner-v1.0.0（仅 runner）
permissions:
 contents: write # 推送 [skip ci] 提交
 packages: write # 推送 GHCR 镜像
env:
 REGISTRY: ghcr.io
 IMAGE_PREFIX: ghcr.io/friday-ai-codes/friday-ai
jobs:
 # ─────────────────────────────────────────────
 # 1. 解析 tag，决定构建哪些服务
 # ─────────────────────────────────────────────
 resolve:
 runs-on: ubuntu-latest
 outputs:
 version: ${{ steps.meta.outputs.version }}
 build_server: ${{ steps.meta.outputs.build_server }}
 build_web: ${{ steps.meta.outputs.build_web }}
 build_runner: ${{ steps.meta.outputs.build_runner }}
 steps:
 - name: Parse tag
 id: meta
 run: |
 TAG="${GITHUB_REF_NAME}"
 echo "tag=$TAG"
 # 提取版本号
 VERSION="${TAG#server-}"
 VERSION="${VERSION#web-}"
 VERSION="${VERSION#runner-}"
 echo "version=$VERSION" >> "$GITHUB_OUTPUT"
 # 决定构建范围
 if [[ "$TAG" == server-v* ]]; then
 echo "build_server=true" >> "$GITHUB_OUTPUT"
 echo "build_web=false" >> "$GITHUB_OUTPUT"
 echo "build_runner=false" >> "$GITHUB_OUTPUT"
 elif [[ "$TAG" == web-v* ]]; then
 echo "build_server=false" >> "$GITHUB_OUTPUT"
 echo "build_web=true" >> "$GITHUB_OUTPUT"
 echo "build_runner=false" >> "$GITHUB_OUTPUT"
 elif [[ "$TAG" == runner-v* ]]; then
 echo "build_server=false" >> "$GITHUB_OUTPUT"
 echo "build_web=false" >> "$GITHUB_OUTPUT"
 echo "build_runner=true" >> "$GITHUB_OUTPUT"
 else
 # 全局 tag（v*）：构建全部
 echo "build_server=true" >> "$GITHUB_OUTPUT"
 echo "build_web=true" >> "$GITHUB_OUTPUT"
 echo "build_runner=true" >> "$GITHUB_OUTPUT"
 fi
 # ─────────────────────────────────────────────
 # 2. 构建并推送 Server 镜像
 # ─────────────────────────────────────────────
 build-server:
 needs: resolve
 if: needs.resolve.outputs.build_server == 'true'
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: docker/login-action@v3
 with:
 registry: ${{ env.REGISTRY }}
 username: ${{ github.actor }}
 password: ${{ secrets.GITHUB_TOKEN }}
 - uses: docker/setup-qemu-action@v3
 - uses: docker/setup-buildx-action@v3
 - uses: docker/build-push-action@v6
 with:
 context: ./server
 platforms: linux/amd64,linux/arm64
 push: true
 tags: |
 ${{ env.IMAGE_PREFIX }}/server:${{ needs.resolve.outputs.version }}
 ${{ env.IMAGE_PREFIX }}/server:latest
 cache-from: type=gha
 cache-to: type=gha,mode=max
 # ─────────────────────────────────────────────
 # 3. 构建并推送 Web 镜像
 # ─────────────────────────────────────────────
 build-web:
 needs: resolve
 if: needs.resolve.outputs.build_web == 'true'
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: docker/login-action@v3
 with:
 registry: ${{ env.REGISTRY }}
 username: ${{ github.actor }}
 password: ${{ secrets.GITHUB_TOKEN }}
 - uses: docker/setup-qemu-action@v3
 - uses: docker/setup-buildx-action@v3
 - uses: docker/build-push-action@v6
 with:
 context: ./web
 platforms: linux/amd64,linux/arm64
 push: true
 tags: |
 ${{ env.IMAGE_PREFIX }}/web:${{ needs.resolve.outputs.version }}
 ${{ env.IMAGE_PREFIX }}/web:latest
 cache-from: type=gha
 cache-to: type=gha,mode=max
 # ─────────────────────────────────────────────
 # 4. 构建并推送 Runner 镜像
 # ─────────────────────────────────────────────
 build-runner:
 needs: resolve
 if: needs.resolve.outputs.build_runner == 'true'
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: docker/login-action@v3
 with:
 registry: ${{ env.REGISTRY }}
 username: ${{ github.actor }}
 password: ${{ secrets.GITHUB_TOKEN }}
 - uses: docker/setup-qemu-action@v3
 - uses: docker/setup-buildx-action@v3
 - uses: docker/build-push-action@v6
 with:
 context: ./runner
 platforms: linux/amd64,linux/arm64
 push: true
 tags: |
 ${{ env.IMAGE_PREFIX }}/runner:${{ needs.resolve.outputs.version }}
 ${{ env.IMAGE_PREFIX }}/runner:latest
 cache-from: type=gha
 cache-to: type=gha,mode=max
 # ─────────────────────────────────────────────
 # 5. 生成 Changelog 并创建 GitHub Release
 # ─────────────────────────────────────────────
 create-release:
 needs: [resolve, build-server, build-web, build-runner]
 if: |
 always &&
 needs.resolve.result == 'success' &&
 (needs.build-server.result == 'success' || needs.build-server.result == 'skipped') &&
 (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
 (needs.build-runner.result == 'success' || needs.build-runner.result == 'skipped')
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 with:
 fetch-depth: 0
 - name: Determine release params
 id: params
 run: |
 TAG="${GITHUB_REF_NAME}"
 # 判断 tag 类型和组件 (per, )
 if [[ "$TAG" == server-v* ]]; then
 echo "component=server" >> "$GITHUB_OUTPUT"
 echo "title=Server ${TAG#server-}" >> "$GITHUB_OUTPUT"
 echo "cliff_args=--tag-pattern server-v.* --include-path server/**/* --latest" >> "$GITHUB_OUTPUT"
 elif [[ "$TAG" == web-v* ]]; then
 echo "component=web" >> "$GITHUB_OUTPUT"
 echo "title=Web ${TAG#web-}" >> "$GITHUB_OUTPUT"
 echo "cliff_args=--tag-pattern web-v.* --include-path web/**/* --latest" >> "$GITHUB_OUTPUT"
 elif [[ "$TAG" == runner-v* ]]; then
 echo "component=runner" >> "$GITHUB_OUTPUT"
 echo "title=Runner ${TAG#runner-}" >> "$GITHUB_OUTPUT"
 echo "cliff_args=--tag-pattern runner-v.* --include-path runner/**/* --latest" >> "$GITHUB_OUTPUT"
 else
 # 全局 tag (per: 包含所有路径变更)
 echo "component=all" >> "$GITHUB_OUTPUT"
 echo "title=${TAG}" >> "$GITHUB_OUTPUT"
 echo "cliff_args=--latest" >> "$GITHUB_OUTPUT"
 fi
 # prerelease 检测 (per )
 if [[ "$TAG" =~ -(rc|beta|alpha) ]]; then
 echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
 else
 echo "prerelease=" >> "$GITHUB_OUTPUT"
 fi
 - name: Generate changelog
 uses: orhun/git-cliff-action@v4
 id: cliff
 with:
 config: cliff.toml
 args: ${{ steps.params.outputs.cliff_args }}
 env:
 GITHUB_REPO: ${{ github.repository }}
 - name: Create GitHub Release
 env:
 GH_TOKEN: ${{ github.token }}
 run: |
 # 使用 notes-file 避免 shell 转义问题 (per Research Pitfall 5)
 cat << 'CLIFF_EOF' > /tmp/release-notes.md
 ${{ steps.cliff.outputs.content }}
 CLIFF_EOF
 gh release create "$GITHUB_REF_NAME" \
 --title "${{ steps.params.outputs.title }}" \
 --notes-file /tmp/release-notes.md \
 ${{ steps.params.outputs.prerelease }}
 # ─────────────────────────────────────────────
 # 6. 更新 Kustomize newTag 并提交回主分支
 # ─────────────────────────────────────────────
 update-manifests:
 needs: [resolve, build-server, build-web, build-runner]
 # 只要 resolve 成功且至少一个 build 成功就执行
 if: |
 always &&
 needs.resolve.result == 'success' &&
 (needs.build-server.result == 'success' || needs.build-server.result == 'skipped') &&
 (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
 (needs.build-runner.result == 'success' || needs.build-runner.result == 'skipped')
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 with:
 ref: main
 token: ${{ secrets.GITHUB_TOKEN }}
 - name: Setup Kustomize
 uses: imranismail/setup-kustomize@v2
 - name: Setup yq
 uses: mikefarah/yq@master
 - name: Update image tags
 env:
 VERSION: ${{ needs.resolve.outputs.version }}
 BUILD_SERVER: ${{ needs.resolve.outputs.build_server }}
 BUILD_WEB: ${{ needs.resolve.outputs.build_web }}
 BUILD_RUNNER: ${{ needs.resolve.outputs.build_runner }}
 run: |
 if [[ "$BUILD_SERVER" == "true" ]]; then
 cd .kube/server/base
 kustomize edit set image ghcr.io/friday-ai-codes/friday-ai/server:${VERSION}
 cd -
 echo "✓ server → ${VERSION}"
 fi
 if [[ "$BUILD_WEB" == "true" ]]; then
 cd .kube/web/base
 kustomize edit set image ghcr.io/friday-ai-codes/friday-ai/web:${VERSION}
 cd -
 echo "✓ web → ${VERSION}"
 fi
 if [[ "$BUILD_RUNNER" == "true" ]]; then
 cd .kube/runner/base
 kustomize edit set image ghcr.io/friday-ai-codes/friday-ai/runner:${VERSION}
 cd -
 echo "✓ runner → ${VERSION}"
 fi
 - name: Update Helm image tags
 env:
 VERSION: ${{ needs.resolve.outputs.version }}
 BUILD_SERVER: ${{ needs.resolve.outputs.build_server }}
 BUILD_WEB: ${{ needs.resolve.outputs.build_web }}
 BUILD_RUNNER: ${{ needs.resolve.outputs.build_runner }}
 run: |
 HELM_VALUES="deploy/helm/friday/values.yaml"
 if [[ "$BUILD_SERVER" == "true" ]]; then
 VERSION=$VERSION yq -i '.server.image.tag = strenv(VERSION)' "$HELM_VALUES"
 echo "✓ helm server → ${VERSION}"
 fi
 if [[ "$BUILD_WEB" == "true" ]]; then
 VERSION=$VERSION yq -i '.web.image.tag = strenv(VERSION)' "$HELM_VALUES"
 echo "✓ helm web → ${VERSION}"
 fi
 if [[ "$BUILD_RUNNER" == "true" ]]; then
 VERSION=$VERSION yq -i '.runner.image.tag = strenv(VERSION)' "$HELM_VALUES"
 echo "✓ helm runner → ${VERSION}"
 fi
 - name: Commit & push
 run: |
 git config user.name "github-actions[bot]"
 git config user.email "github-actions[bot]@users.noreply.github.com"
 git add .kube/ deploy/helm/friday/values.yaml
 # 如果没有变更（newTag 已经是目标版本）则跳过
 if git diff --cached --quiet; then
 echo "No manifest changes, skipping commit"
 exit 0
 fi
 git commit -m "release: update image tags to ${{ needs.resolve.outputs.version }} [skip ci]"
 git push origin main
