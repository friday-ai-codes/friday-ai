name: Build & Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  # 关闭 docker/build-push-action 的 build summary：它会往日志里塞一张内嵌
  # PNG（base64），且失败时常因拿到 HTML 而报 "invalid character '<'"，
  # 既污染日志又会盖住真正的构建错误。
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  # ── 1. 并行构建各服务的单架构镜像 ──────────────────
  build:
    name: build-${{ matrix.service.name }}-${{ matrix.platform.pair }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: server, context: ./server, dockerfile: ./server/Dockerfile }
          - { name: web,    context: ./web,    dockerfile: ./web/Dockerfile }
          - { name: runner, context: ./runner, dockerfile: ./runner/Dockerfile }
          - { name: task,   context: ./task,   dockerfile: ./task/Dockerfile }
        platform:
          - { os: linux/amd64, pair: amd64, runner: ubuntu-latest }
          - { os: linux/arm64, pair: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.platform.os }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }},push-by-digest=true,name-canonical=true,push=true
          # APP_VERSION 仅 web 镜像使用（注入前端展示的版本号），其余服务忽略该 build-arg
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          # 跨 run 复用层缓存：用 registry 后端把缓存推到 ghcr 的 buildcache-* tag，
          # 比 type=gha 更持久（不受每仓库 10GB LRU 驱逐限制）。按服务+架构分 tag 隔离。
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:buildcache-${{ matrix.platform.pair }}
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:buildcache-${{ matrix.platform.pair }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.service.name }}-${{ matrix.platform.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── 2. 合并多架构 manifest ─────────────────────────
  merge:
    name: merge-${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [server, web, runner, task]
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - name: Create multi-arch manifest
        run: |
          IMAGE="${IMAGE_PREFIX}/${{ matrix.service }}"
          VERSION="${GITHUB_REF_NAME}"
          mapfile -t DIGESTS < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort)
          REFS=()
          for d in "${DIGESTS[@]}"; do
            REFS+=("${IMAGE}@sha256:${d}")
          done
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${REFS[@]}"

  # ── 3. 打包并发布 Helm Chart 到 GHCR (OCI) ─────────
  helm:
    name: publish-helm-chart
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Compute chart version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Chart 版本必须是合法 SemVer（不带前缀 v）；appVersion 保留完整 tag
          echo "chart_version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "app_version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Helm registry login (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" \
            --username "${{ github.actor }}" --password-stdin

      - name: Lint chart
        run: helm lint deploy/helm/friday

      - name: Package & push chart
        run: |
          mkdir -p /tmp/helm
          helm package deploy/helm/friday \
            --version "${{ steps.ver.outputs.chart_version }}" \
            --app-version "${{ steps.ver.outputs.app_version }}" \
            -d /tmp/helm
          helm push "/tmp/helm/friday-${{ steps.ver.outputs.chart_version }}.tgz" \
            "oci://${IMAGE_PREFIX}/charts"

  # ── 4. 创建 GitHub Release ────────────────────────
  release:
    needs: [merge, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine release params
        id: params
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "title=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ -(rc|beta|alpha) ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat << 'CLIFF_EOF' > /tmp/release-notes.md
          ${{ steps.cliff.outputs.content }}
          CLIFF_EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ steps.params.outputs.title }}" \
            --notes-file /tmp/release-notes.md \
            ${{ steps.params.outputs.prerelease }}
