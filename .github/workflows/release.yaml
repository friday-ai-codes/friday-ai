name: Build & Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ── 1. 并行构建各服务的单架构镜像 ──────────────────
  build:
    name: build-${{ matrix.service.name }}-${{ matrix.platform.pair }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: server, context: ./server, dockerfile: ./server/Dockerfile }
          - { name: web,    context: ./web,    dockerfile: ./web/Dockerfile }
          - { name: runner, context: ./runner, dockerfile: ./runner/Dockerfile }
        platform:
          - { os: linux/amd64, pair: amd64, runner: ubuntu-latest }
          - { os: linux/arm64, pair: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: ${{ matrix.platform.os }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service.name }}-${{ matrix.platform.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}-${{ matrix.platform.pair }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service.name }}-${{ matrix.platform.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── 2. 合并多架构 manifest ─────────────────────────
  merge:
    name: merge-${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [server, web, runner]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - name: Create multi-arch manifest
        run: |
          IMAGE="${IMAGE_PREFIX}/${{ matrix.service }}"
          VERSION="${GITHUB_REF_NAME}"
          mapfile -t DIGESTS < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort)
          REFS=()
          for d in "${DIGESTS[@]}"; do
            REFS+=("${IMAGE}@sha256:${d}")
          done
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${REFS[@]}"

  # ── 3. 创建 GitHub Release ────────────────────────
  release:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine release params
        id: params
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "title=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ -(rc|beta|alpha) ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat << 'CLIFF_EOF' > /tmp/release-notes.md
          ${{ steps.cliff.outputs.content }}
          CLIFF_EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ steps.params.outputs.title }}" \
            --notes-file /tmp/release-notes.md \
            ${{ steps.params.outputs.prerelease }}
