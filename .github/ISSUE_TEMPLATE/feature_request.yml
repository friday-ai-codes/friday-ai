name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述场景与痛点，而不是直接给实现方案
      placeholder: 例：团队用 Jira 而不是飞书项目，希望需求也能从 Jira 触发工作流
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案（可选）
      description: 如果你已有想法，描述期望的行为或交互
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 现状绕过方式（可选）
      description: 目前你是怎么绕过这个问题的
